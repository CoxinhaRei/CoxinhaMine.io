document.addEventListener("keydown", e=>{
  if(typeof e.key!=='string')return;
  if(!typing && e.key.toLowerCase() === 'c')toggleHudPanel('craft');
  if(e.key === 'Escape'){shopOpen=false;talentsOpen=false;inventoryOpen=false;craftOpen=false;extraPanel=null;cavePromptOpen=false;typing=false;document.activeElement?.blur?.();return;}
  if(e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
  if(e.target.closest?.('select,[role="dialog"]') || (e.key==='Enter' && e.target.closest?.('button,a'))) return;
  if(e.key === "1"){
  player.selectedSlot = 0;
}

  player.selectedSlot = 1;
}
if(e.key === "3"){

}

  if(!typing && e.key === "b") toggleHudPanel('inventory');
  if(!typing && e.key === "v") toggleHudPanel('shop');
  if(!typing && e.key === "t") toggleHudPanel('talents');

// vender tudo

  for(let item of player.inventory){
    if(item.type==='material')total += (item.amount ?? 1) * (ORE_VALUES[materialRarity(item)] || item.value || 1) * 5;

  player.inventory = player.inventory.filter(item=>item.type!=='material');

  addChat("💰 Vendeu tudo por " + total);
}

  if(e.key === "Enter"){
    e.preventDefault();
    focusGameChat();
    return;
  }

  if(!typing) return;

  if(e.key === "Backspace"){
    chatInput = chatInput.slice(0,-1);
    return;
  }

  if(e.key.length === 1){
    chatInput += e.key;
  }
});
// ===== SOCKET SAFE =====

  if(!data) return;
  window.sharedWorldAvailable=!!data.sharedWorld;

  playerId = data.id || null;
  players = data.players || {};
  if(currentRealm==='cave')realmStates.garden.ores=data.ores || [];
  else ores=data.ores || [];
});

socket.on("updatePlayers", data=>{
  players = typeof mergeRemotePlayers==='function' ? mergeRemotePlayers(data) : data || {};
});

  if(currentRealm==='cave')realmStates.garden.ores=realmStates.garden.ores.filter(o=>o && o.id!==id);
  else ores = ores.filter(o=>o && o.id !== id);
});

socket.on("chatMessage", data=>{ addChat(data); });
setInterval(() => {
  if(player && player.level && typeof multiplayer!=='undefined' && multiplayer.ready){

  }
}, 15000);

});

// ===== FALLBACK (SE SERVER FALHAR) =====
function createOre(x, y){

  let zone = getZone(x,y);
  let rarity = getRandomRarityFromZone(zone) || rarities[0];
  let index = rarities.indexOf(rarity);

  if(!GAME_CATALOG.gardenOrePositionValid(x,y,GAME_CATALOG.oreRadius(rarity.name),WORLD_SIZE))return null;
  return {
    id: Math.random().toString(36).substr(2,9),

    x,
    y,

    size: 12 + index * 6,

    hp: rarity.hp,
    maxHp: rarity.hp,

    rarity,

    // ✨ NOVO
    rotation: Math.random() * Math.PI * 2,
    shape: Math.floor(Math.random()*3), // 0,1,2 formatos
    hit: 0
  };
}
function spawnBoss(type){
  if(isServerWorld())return;

  // evita flood
  let exists = ores.some(o => o.rarity?.name === type);
  if(exists) return;

  if(Math.random() > 0.00005) return; // chance realista

  let pos = getValidPosition();

  let data = {
    SUPER: {color:"#00ffff", hp:2000000},
    ABSOLUT: {color:"#ffffff", hp:8000000}
  };

  let boss = data[type];
  const size=GAME_CATALOG.oreRadius(type);
  if(!GAME_CATALOG.gardenOrePositionValid(pos.x,pos.y,size,WORLD_SIZE) || ores.some(o=>GAME_CATALOG.orePositionsOverlap(pos.x,pos.y,size,o)))return;

  ores.push({
    id: type+"_"+Date.now(),
    x: pos.x,
    y: pos.y,
    size,
    hp: boss.hp,
    maxHp: boss.hp,
    rarity:{name:type,color:boss.color},
    isBoss:true
  });

  addChat("🔥 " + type + " apareceu!");
}
function spawnOreInCell(cx, cy, nearby=ores){

  let baseX = cx * CELL_SIZE;
  let baseY = cy * CELL_SIZE;

  let x = baseX + Math.random() * CELL_SIZE;
  let y = baseY + Math.random() * CELL_SIZE;

  if(
    x < MAP_PADDING || 
    y < MAP_PADDING || 
    x > WORLD_SIZE - MAP_PADDING || 
    y > WORLD_SIZE - MAP_PADDING
  ){
    return;
  }

  let zone = getZone(x,y);
  if(zone === "P") return;

  let rarity = getRandomRarityFromZone(zone) || rarities[0];
  let index = rarities.indexOf(rarity);
  const size=GAME_CATALOG.oreRadius(rarity.name);
  if(!GAME_CATALOG.gardenOrePositionValid(x,y,size,WORLD_SIZE) || MAP_ATLAS.blocked(currentRealm,x,y,size) || mobs.some(m=>Math.hypot(m.x-x,m.y-y)<m.size+size+100) || Math.hypot(x-player.x,y-player.y)<size+350)return;

  for(let o of nearby){
    if(GAME_CATALOG.orePositionsOverlap(x,y,size,o)){
      return;
    }
  }

  // 🔥 lados da pedra
  let sides = Math.min(12, Math.floor(3 + index * 1.5));
  let irregularity = 0.3;

  let points = [];

  for(let i = 0; i < sides; i++){
    let angle = (i / sides) * Math.PI * 2;

    let radius = 1 - irregularity + Math.random() * irregularity;

    points.push({
      angle,
      radius
    });
  }

  ores.push({
    id: Math.random().toString(36).substr(2,9),
    x,
    y,
    isBoss:index>=7,
    size,
    hp: rarity.hp,
    maxHp: rarity.hp,
    rarity,
    rotation: Math.random() * Math.PI * 2,
    points: points,
    hit: 0
  });
}
function drawRock(ore){
  drawCrystal(ore);
}
function checkLevelUp(){
  if(!player.xpToNext)player.xpToNext=xpForLevel(player.level);
  while(player.xp>=player.xpToNext){
    player.xp-=player.xpToNext;
    player.level++;
    player.xpToNext=xpForLevel(player.level);
    player.talentPoints=(player.talentPoints || 0)+1;
    checkAchievements();
  }
}
function getRandomRarityFromZone(zone){
  if(/^Z[0-9]$/.test(zone))return rarities[MAP_ATLAS.rollTier(Number(zone.slice(1)))];

  let chances = ZONE_CHANCES[zone];
  if(!chances) return rarities[0];

  let r = Math.random();
  let sum = 0;

  for(let i=0;i<chances.length;i++){
    sum += chances[i];
    if(r <= sum){
      return rarities[i];
    }
  }

  return rarities[0];
}

function addChat(msg){
  if(msg && typeof msg==='object')chat.push({name:String(msg.name || '').slice(0,32),text:String(msg.text || '').slice(0,220),level:Math.max(1,Number(msg.level)||1),rarityIndex:Math.max(0,Math.min(11,Number(msg.rarityIndex)||0))});
  else chat.push(String(msg).slice(0,300));
  if(chat.length>80) chat.shift();
}

// ===== DESENHO =====
function drawPlayer(x, y, entity=player){
  if(entity.dead){drawDeadPlayer(x,y,entity);return;}
  const size=(entity.size || player.size)*3;
  const aim=entity===player ? (typeof playerAimAngle==='function' ? playerAimAngle() : Math.atan2(mouse.y-canvas.height/2,mouse.x-canvas.width/2)) : (entity.aimAngle || 0);
  const dx=Math.cos(aim),dy=Math.sin(aim);
  const distance=Math.hypot(dx,dy)||1;
  ctx.save();
  if(typeof drawAttachedAccessories==='function')drawAttachedAccessories(x,y,entity);
  if(playerBodyImg.complete && playerBodyImg.naturalWidth) ctx.drawImage(playerBodyImg,x-size/2,y-size/2,size,size);
  if(playerEyesImg.complete && playerEyesImg.naturalWidth) ctx.drawImage(playerEyesImg,x-size/2+dx/distance*4,y-size/2+dy/distance*4,size,size);
  drawPlayerArmor(x,y,entity);
  const held=entity===player ? (player.selectedSlot===3 && player.equipment.utility ? player.equipment.utility : player.selectedSlot===0 && player.equipment.weapon ? player.equipment.weapon : player.equipment.pickaxe) : getRemoteEquipment(entity);
  drawHeldEquipment(held,x,y,aim,entity===player,entity);
  if(entity!==player){
    const aiming=Date.now()<(entity.attackUntil || 0),radius=aiming ? 95 : 78;
    ctx.globalAlpha=aiming ? .8 : .3;ctx.strokeStyle='#fff4c4';ctx.lineWidth=1.5;
    const ax=x+Math.cos(aim)*radius,ay=y+Math.sin(aim)*radius;
    ctx.beginPath();ctx.moveTo(x+Math.cos(aim)*48,y+Math.sin(aim)*48);ctx.lineTo(ax,ay);ctx.stroke();ctx.beginPath();ctx.arc(ax,ay,4,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}
function saveGame(){
  if(!window.accountProgressEnabled)return;

  try{

    let data = {
      coins: player.coins,
      level: player.level,
      xp: player.xp,
      xpToNext: player.xpToNext,

      inventory: player.inventory,
     equipment: {
     weapon: player.equipment.weapon,
     armor: player.equipment.armor,
     utility: player.equipment.utility,
     pickaxe: player.equipment.pickaxe?.name || "Madeira"
},
      talents: player.talents,
      talentPoints: player.talentPoints,
      talentRanks: player.talentRanks,
      maxHp: player.maxHp,
      progressionVersion: player.progressionVersion,
      abilityReadyAt: player.abilityReadyAt,
      journal: player.journal,accessories:player.accessories,accessoryVersion:player.accessoryVersion,joinedAt:player.joinedAt,
      pendingCraft: player.pendingCraft,
      
      x: player.x,
      y: player.y
    };

    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    if(typeof queuePlayerSave==='function')queuePlayerSave(data);


  }catch(err){
    console.error("Erro ao salvar:", err);
  }
}
let nextUltraSpawn = 0;
function spawnUltraOre(){
  if(isServerWorld())return;
  if(performance.now() < nextUltraSpawn) return;
  nextUltraSpawn = performance.now() + 15000;

  if(Math.random() > 1) return;

  let pos = getEdgePosition();

  let rarity = rarities.find(r => r.name === "ULTRA");
  const size=GAME_CATALOG.oreRadius(rarity.name);
  if(!GAME_CATALOG.gardenOrePositionValid(pos.x,pos.y,size,WORLD_SIZE) || ores.some(o=>GAME_CATALOG.orePositionsOverlap(pos.x,pos.y,size,o)))return;

  ores.push({
    id: "ultra_" + Date.now(),
    x: pos.x,
    y: pos.y,
    size,
    hp: rarity.hp,
    maxHp: rarity.hp,
    rarity,
    hit: 0
  });
}
function drawOres(){
  ctx.save();
  for(const ore of ores){
    if(!ore || !ore.rarity || !Number.isFinite(ore.x) || !Number.isFinite(ore.y)) continue;
    if(Math.abs(ore.x-player.x)>worldViewWidth()/2+ore.size*2 || Math.abs(ore.y-player.y)>worldViewHeight()/2+ore.size*2) continue;
    drawRock(ore);
    const width = ore.size * 2;
    if(typeof drawEntityHealth==='function')drawEntityHealth(ore,ore.x,ore.y+ore.size+29,Math.min(180,Math.max(35,width)),ore.rarity.color);
    ctx.font = "bold 11px Ubuntu";
    ctx.fillStyle=ore.rarity.color;
    ctx.textAlign = "center";
    if(settings.names)ctx.fillText(ore.rarity.name, ore.x, ore.y+ore.size+18);
  }
  ctx.restore();
}

let nextGardenSpawnAt=0;
function updateSpawnSystem(){
  if(isServerWorld())return;
  if(currentRealm==='cave'){populateCave();return;}
  if(performance.now()<nextGardenSpawnAt)return;
  nextGardenSpawnAt=performance.now()+250;
  // Invalid positions are discarded, never projected onto the plaza boundary.
  ores=ores.filter(ore=>{
    if(!ore?.rarity)return false;
    normalizeOreScale(ore);
    return GAME_CATALOG.gardenOrePositionValid(ore.x,ore.y,ore.size,WORLD_SIZE);
  });

  let range = 2000;

  let startX = player.x - range;
  let endX   = player.x + range;
  let startY = player.y - range;
  let endY   = player.y + range;

  for(let x = startX; x < endX; x += CELL_SIZE){
    for(let y = startY; y < endY; y += CELL_SIZE){

      let cx = Math.floor(x / CELL_SIZE);
      let cy = Math.floor(y / CELL_SIZE);

      let key = cx + "," + cy;

      if(!cells[key]){
        cells[key] = { ores: 0 };
      }

      // conta quantos ores já existem nessa célula
      let count = 0;

      for(let o of ores){
        let ocx = Math.floor(o.x / CELL_SIZE);
        let ocy = Math.floor(o.y / CELL_SIZE);

        if(ocx === cx && ocy === cy){
          count++;
        }
      }

      // spawn se tiver pouco
      if(count < MAX_ORES_PER_CELL){
        spawnOreInCell(cx, cy);
      }
    }
  }
}

function drawCity(brush=ctx){
  const x = CITY.x - CITY.size / 2;
  const y = CITY.y - CITY.size / 2;
  brush.save();
  brush.fillStyle = "#5a8b65";
  brush.fillRect(x - 22, y - 22, CITY.size + 44, CITY.size + 44);
  brush.fillStyle = "#a1a99a";
  brush.fillRect(x, y, CITY.size, CITY.size);
  brush.strokeStyle = "#8b9589";
  brush.lineWidth = 2;
  for(let offset = 0; offset <= CITY.size; offset += 80){
    brush.beginPath();
    brush.moveTo(x + offset, y);
    brush.lineTo(x + offset, y + CITY.size);
    brush.moveTo(x, y + offset);
    brush.lineTo(x + CITY.size, y + offset);
    brush.stroke();
  }
  // Four garden beds frame the shared arrival point.
  for(const dx of [-1, 1]){
    for(const dy of [-1, 1]){
      const bx = CITY.x + dx * 410;
      const by = CITY.y + dy * 410;
      brush.fillStyle = "#62785a";
      brush.fillRect(bx - 125, by - 125, 250, 250);
      brush.fillStyle = "#408553";
      brush.fillRect(bx - 110, by - 110, 220, 220);
      for(let n = 0; n < 9; n++){
        const fx = bx - 70 + (n % 3) * 70;
        const fy = by - 70 + Math.floor(n / 3) * 70;
        brush.fillStyle = n % 2 ? "#f5cb65" : "#efa7b9";
        brush.beginPath();
        brush.arc(fx, fy, 13, 0, Math.PI * 2);
        brush.fill();
        brush.fillStyle = "#fff2b0";
        brush.beginPath();
        brush.arc(fx, fy, 5, 0, Math.PI * 2);
        brush.fill();
      }
    }
  }
  brush.fillStyle = "#c1c5ae";
  brush.beginPath();
  brush.arc(CITY.x, CITY.y, 145, 0, Math.PI * 2);
  brush.fill();
  brush.strokeStyle = "#e8e1bb";
  brush.lineWidth = 8;
  brush.stroke();
  brush.fillStyle = "#61735d";
  brush.font = "bold 24px Ubuntu";
  brush.textAlign = "center";
  brush.fillText("PRAÇA CENTRAL", CITY.x, CITY.y - 185);
  brush.font = "14px Ubuntu";
  brush.fillText("Ponto de encontro", CITY.x, CITY.y - 160);
  brush.restore();
}

function drawTooltip(){

  if(!hoveredItem || !hoveredSlot) return;

  let text1 = hoveredItem.name;
  let text2 = "Valor: " + (hoveredItem.value * 5);
  let text3 = "Qtd: " + (hoveredItem.amount || 1);

  ctx.font = "14px Ubuntu";

  let padding = 8;
  let width = Math.max(
    ctx.measureText(text1).width,
    ctx.measureText(text2).width,
    ctx.measureText(text3).width
  ) + padding*2;

  let height = 60;

  let x = mouse.x + 15;
  let y = mouse.y + 15;

  // não sair da tela
  if(x + width > canvas.width) x = canvas.width - width - 10;
  if(y + height > canvas.height) y = canvas.height - height - 10;

  // fundo
  ctx.fillStyle = "rgba(0,0,0,0.85)";
  ctx.fillRect(x, y, width, height);

  // borda da raridade
  ctx.strokeStyle = hoveredItem.color || "white";
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, width, height);

  // texto
  ctx.fillStyle = hoveredItem.color || "white";
  ctx.fillText(text1, x + padding, y + 18);

  ctx.fillStyle = "white";
  ctx.fillText(text2, x + padding, y + 34);
  ctx.fillText(text3, x + padding, y + 50);
}

function getEdgePosition(){

  let side = Math.floor(Math.random() * 4);
  let margin = 500;

  let x, y;

  if(side === 0){ // topo
    x = Math.random() * WORLD_SIZE;
    y = margin;
  }
  else if(side === 1){ // baixo
    x = Math.random() * WORLD_SIZE;
    y = WORLD_SIZE - margin;
  }
  else if(side === 2){ // esquerda
    x = margin;
    y = Math.random() * WORLD_SIZE;
  }
  else{ // direita
    x = WORLD_SIZE - margin;
    y = Math.random() * WORLD_SIZE;
  }

  return {x, y};
}

// ===== LOOP SAFE =====
let lastMobFrame = performance.now();
function loop(){
  if(document.getElementById('menu').style.display!=='none')return;
  try{
    const now = performance.now();
    const mobDelta = Math.min(.15,Math.max(.001,(now-lastMobFrame)/1000));
    lastMobFrame = now;
    ctx.globalAlpha = 1;
    ctx.font='bold 13px "Ubuntu"';
    ctx.clearRect(0,0,canvas.width,canvas.height);
    updateSpawnSystem();
    updateAdventure(mobDelta);
    // ===== MOVIMENTO =====

    movePlayerPhysics(mobDelta);
    updateCombatWorld(mobDelta);
    sendPlayerMovement();

   
    // ===== CAMERA =====
    ctx.save();
    ctx.translate(canvas.width/2,canvas.height/2);
    ctx.scale(cameraZoom(),cameraZoom());
    const renderPosition=typeof renderedPlayerPosition==='function' ? renderedPlayerPosition() : player;
    ctx.translate(-renderPosition.x,-renderPosition.y);

    // ===== CHÃO (SIMPLIFICADO PRA NÃO BUGAR) =====
    drawWorld();

    // 👉 se quiser usar zonas depois, a gente arruma com segurança
    drawOres();
    if(typeof drawGroundLoot==='function')drawGroundLoot();
    drawGuardians();
    drawCombatEffects();
    drawAbilityEffects();

    // ===== OUTROS PLAYERS =====
    for(let id in players){
      let p = players[id];
      if(!p || id === playerId || (p.realm || 'garden')!==currentRealm) continue;

      drawPlayer(p.x, p.y, p);

      if(typeof drawPlayerLabels==='function')drawPlayerLabels(p.x,p.y,p);
      if(typeof drawEntityHealth==='function')drawEntityHealth(p,p.x,p.y+(p.size||20)*1.75+25/cameraZoom(),64/cameraZoom(),'#a9ee6b');
    }


    // ===== PLAYER LOCAL =====
    drawPlayer(renderPosition.x, renderPosition.y);

    if(typeof drawPlayerLabels==='function')drawPlayerLabels(renderPosition.x,renderPosition.y,{...player,guildTag:guildState.directory.find(g=>g.id===guildState.guildId)?.tag,rarityIndex:highestOwnedRarity()});
    if(typeof drawEntityHealth==='function')drawEntityHealth(player,renderPosition.x,renderPosition.y+(player.size||20)*1.75+25/cameraZoom(),72/cameraZoom(),'#a9ee6b');

    ctx.restore();
    drawCaveDarkness();
    drawInventory();
    drawXP();
    drawTalents();
    drawTooltip();
    drawMinimap();
    drawChat();
    checkLevelUp();
    drawShop();
    drawHotbar();
    if(currentRealm==='garden')spawnUltraOre();
    drawEquipment();
    drawCraft();
    // Equipment is restored only when the authoritative player state changes.
    if(currentRealm==='garden'){spawnBoss("SUPER");spawnBoss("ABSOLUT");}
    showHUD();
    renderSystems();
    renderAdventureUi();
  }catch(err){
  console.error("ERRO LOOP:", err);
  }

  requestAnimationFrame(loop);
}

async function startGame(){
  if(window.startingGame)return;window.startingGame=true;
  try{const connected=await beginSharedSession();
  if(!connected)return;

  const enter=()=>{if(extraPanel==='changelog')extraPanel=null;document.getElementById('menu').style.display='none';canvas.style.display='block';resizeCanvas();mouse.x=canvas.width/2;mouse.y=canvas.height/2;document.getElementById('game-hud').hidden=false;movementAimActive=false;lastMobFrame=performance.now();loop();};
  if(typeof irisTransition==='function')await irisTransition(enter);else enter();}catch{sharedNotice('Não foi possível entrar. Tente novamente.');}finally{window.startingGame=false;}
}
